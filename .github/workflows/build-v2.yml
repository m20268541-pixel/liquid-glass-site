name: Build APK v2

on:
  workflow_dispatch:
  push:
    paths:
      - project.zip
      - .github/workflows/build-v2.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project into v2 folder
        run: |
          unzip -o project.zip
          ls -R v2 | head -50
          test -f v2/settings.gradle.kts
          test -f v2/app/build.gradle.kts
          test -f v2/app/src/main/java/com/liquidglass/app/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK (v2)
        working-directory: v2
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-v2-apk
          path: v2/app/build/outputs/apk/debug/*.apk
